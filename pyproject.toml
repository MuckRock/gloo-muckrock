[tool.poetry]
name = "gloo-muckrock"
version = "0.1.0"
description = ""
authors = ["None"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
tiktoken = "^0.5.1"
baml-py = "^0.223.0"
pydantic = ">=2.7"


[tool.poetry.group.analytics.dependencies]
ipykernel = "^6.25.1"
pandas = "^2.0.3"
matplotlib = "^3.7.2"
np = "^1.0.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.0.287"
python-dotenv = {extras = ["cli"], version = "^1.0.0"}
pytest = "^8.0"
pytest-asyncio = "^0.23"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
